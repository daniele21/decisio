name: Scorer matrix smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/scorer-matrix-smoke.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/decisio/backends/llama_cpp.py"
      - "src/decisio/baselines/generation.py"
      - "src/decisio/benchmark.py"
      - "src/decisio/cli.py"
      - "src/decisio/comparison.py"
      - "src/decisio/compiler.py"
      - "src/decisio/scorers/**"
      - "benchmarks/build_scorer_gate_fixture.py"

permissions:
  contents: read

concurrency:
  group: scorer-matrix-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qwen-gguf-cpu-directional:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU llama.cpp runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "diskcache>=5.6.1" "jinja2>=2.11.3" "numpy>=1.20" "typing-extensions>=4.5"
          python -m pip install --index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --no-deps "llama-cpp-python==0.3.35"
          python -m pip install -e . --no-deps
      - name: Download pinned Qwen3.5-0.8B Q4_K_M smoke artifact
        run: |
          MODEL=/tmp/Qwen3.5-0.8B-Q4_K_M.gguf
          curl -L --fail --retry 3 \
            "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/91840701981c3152e23662fa4416d7a93cab90e2/Qwen3.5-0.8B-Q4_K_M.gguf?download=true" \
            -o "$MODEL"
          echo "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517  $MODEL" | sha256sum -c -
          echo "DECISIO_SMOKE_MODEL=$MODEL" >> "$GITHUB_ENV"
      - name: Materialize frozen CI scorer workload
        run: |
          python benchmarks/build_scorer_gate_fixture.py --ci --output /tmp/scorer-gate-ci.jsonl
      - name: Run v2-v1-letters-generated matrix
        run: |
          decisio compare \
            --input /tmp/scorer-gate-ci.jsonl \
            --output-dir /tmp/scorer-gate \
            --model "$DECISIO_SMOKE_MODEL" \
            --device cpu \
            --n-ctx 4096 \
            --threads 2 \
            --threads-batch 2
      - name: Verify directional evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/scorer-gate/comparison.json").read_text())
          assert report["examples"] == 8, report
          assert report["input_sha256"] == "360a972d7732cc0039113f4a41fbb3d51630439e4084631dbf4d1b60c63c1d17"
          assert set(report["scorers"]) == {
              "semantic", "semantic-independent", "letters", "generated",
          }
          for scorer in ("semantic", "semantic-independent", "letters"):
              assert report["scorers"][scorer]["normal"]["generated_tokens"] == 0
              assert report["scorers"][scorer]["reverse_candidates"]["generated_tokens"] == 0
          assert report["scorers"]["generated"]["normal"]["generated_tokens"] > 0
          PY
      - name: Upload scorer matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisio-scorer-matrix-qwen35-08b-q4km-llamacpp
          path: |
            /tmp/scorer-gate-ci.jsonl
            /tmp/scorer-gate/
          if-no-files-found: warn
          retention-days: 14
