name: CPU scorer gate

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
    paths:
      - ".github/workflows/scorer-gate-cpu.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/decisio/**"
      - "benchmarks/**"

permissions:
  contents: read

jobs:
  gate-v2-not-frozen:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Block promotion until llama.cpp gate v2 is frozen
        run: |
          echo "The Transformers/BF16 scorer gate is superseded."
          echo "Freeze the exact Qwen3.5-4B Q4_K_M GGUF + llama.cpp shared-context gate-v2 contract first."
          exit 1
