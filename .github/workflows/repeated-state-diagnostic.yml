name: Repeated-state diagnostic

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/repeated-state-diagnostic.yml"
      - "scripts/diagnose_repeated_state.py"
      - "tests/test_repeated_state_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repeated-state-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repeated-state:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL: /tmp/Qwen3.5-2B-Q4_K_M.gguf
      OUTPUT: .artifacts/repeated-state-diagnostic.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CPU llama.cpp runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "diskcache>=5.6.1" "jinja2>=2.11.3" "numpy>=1.20" "typing-extensions>=4.5"
          python -m pip install --index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --no-deps "llama-cpp-python==0.3.35"
          python -m pip install -e . --no-deps

      - name: Download frozen Qwen3.5-2B Q4_K_M artifact
        run: |
          curl -L --fail --retry 3 \
            "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/1c466474d208da1a7c4b8cb87ebcdac78f160e34/Qwen3.5-2B-Q4_K_M.gguf?download=true" \
            -o "$MODEL"
          echo "aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223  $MODEL" | sha256sum -c -
          test "$(stat -c %s "$MODEL")" = "1280835840"

      - name: Compare repeated-state semantic and generated paths
        run: |
          python scripts/diagnose_repeated_state.py \
            --model "$MODEL" \
            --output "$OUTPUT" \
            --rounds 2 \
            --n-ctx 8192 \
            --n-batch 512 \
            --n-ubatch 512 \
            --threads 2 \
            --threads-batch 2

      - name: Record source and host identity
        if: always()
        run: |
          mkdir -p .artifacts
          {
            echo "github_sha=$GITHUB_SHA"
            python --version
            uname -a
            lscpu
          } > .artifacts/repeated-state-host.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisio-repeated-state-diagnostic-qwen35-2b-q4km
          path: |
            .artifacts/repeated-state-diagnostic.json
            .artifacts/repeated-state-host.txt
          if-no-files-found: warn
          retention-days: 14
