name: Decisio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dependency lock candidate
        run: |
          python -m pip install "uv==0.10.0"
          uv lock
          sha256sum uv.lock
      - name: Upload dependency lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: decisio-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest
      - name: Compile package
        run: python -m compileall -q src tests examples
