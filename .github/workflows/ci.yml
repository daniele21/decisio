name: Decisio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.10.0"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Validate specialized engineering contracts
        run: |
          uv run python template/scripts/verify_operations.py --root .
          uv run python template/scripts/verify_e2e.py --root .
          uv run python template/scripts/verify_product_development.py --root .
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Test
        run: uv run pytest
      - name: Compile package
        run: uv run python -m compileall -q src tests examples
