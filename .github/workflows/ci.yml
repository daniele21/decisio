name: Decisio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.10.0"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Test
        run: uv run pytest
      - name: Compile package
        run: uv run python -m compileall -q src tests examples
      - name: Build package
        run: uv build
      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/decisio-wheel-smoke
          /tmp/decisio-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/decisio-wheel-smoke/bin/python -c "import decisio; print(decisio.__version__)"
          /tmp/decisio-wheel-smoke/bin/decisio --help
