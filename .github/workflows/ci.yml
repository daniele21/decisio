name: Decisio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dependency lock candidate
        run: |
          python -m pip install "uv==0.10.0"
          uv lock
          sha256sum uv.lock
      - name: Commit dependency lock on hardening branch
        if: github.event_name == 'pull_request' && github.head_ref == 'hardening/benchmark-contracts-v1'
        run: |
          if git diff --quiet -- uv.lock && test -f uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock already committed and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: lock Python dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest
      - name: Compile package
        run: python -m compileall -q src tests examples
