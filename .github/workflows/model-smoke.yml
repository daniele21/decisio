name: Real model smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/model-smoke.yml"
      - "pyproject.toml"
      - "src/decisio/backends/qwen.py"
      - "src/decisio/compiler.py"
      - "src/decisio/schema.py"
      - "src/decisio/scorers/semantic.py"
      - "benchmarks/fixtures/ci-smoke.json"
      - "examples/snake/**"

permissions:
  contents: read

concurrency:
  group: real-model-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qwen-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
          python -m pip install "transformers>=5.17,<6" "pillow>=10"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -e . --no-deps

      - name: Run real Qwen3.5 semantic scorer
        run: |
          decisio score \
            --input benchmarks/fixtures/ci-smoke.json \
            --scorer semantic \
            --model Qwen/Qwen3.5-0.8B \
            --revision 2fc06364 \
            --device cpu \
            --dtype bfloat16 \
            > /tmp/decisio-real-model-smoke.json

      - name: Verify zero-generation result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/decisio-real-model-smoke.json")
          result = json.loads(path.read_text())

          assert result["generated_tokens"] == 0, result
          assert result["scorer"] == "semantic_comparative_logodds_v2", result
          assert result["probability_status"] == "uncalibrated_conditional_scores", result
          assert result["choice"] in {"billing", "technical"}, result
          assert set(result["distribution"]) == {"billing", "technical"}, result
          assert abs(sum(result["distribution"].values()) - 1.0) < 1e-6, result
          assert result["model"]["model"] == "Qwen/Qwen3.5-0.8B", result
          assert result["model"]["model_type"] == "qwen3_5_text", result

          print(json.dumps({
              "choice": result["choice"],
              "distribution": result["distribution"],
              "generated_tokens": result["generated_tokens"],
              "model": result["model"],
          }, indent=2, sort_keys=True))
          PY

      - name: Run real-model Snake rollout
        run: |
          python -m examples.snake.play \
            --model Qwen/Qwen3.5-0.8B \
            --revision 2fc06364 \
            --device cpu \
            --dtype bfloat16 \
            --seed 7 \
            --max-steps 5 \
            --trace /tmp/decisio-snake-smoke.jsonl

      - name: Verify Snake decision loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = Path("/tmp/decisio-snake-smoke.jsonl").read_text().splitlines()
          assert 1 <= len(rows) <= 5, rows
          for line in rows:
              record = json.loads(line)
              decision = record["decision"]
              constraints = record["constraints"]
              safe = set(constraints["safe_actions"])

              assert decision["generated_tokens"] == 0, record
              assert abs(sum(decision["distribution"].values()) - 1.0) < 1e-6, record
              if safe:
                  assert decision["choice"] in safe, record
              if constraints["mode"] == "model":
                  assert len(safe) >= 2, record
                  assert decision["scorer"] == "semantic_comparative_logodds_v2", record

          last = json.loads(rows[-1])
          print(json.dumps({
              "steps": len(rows),
              "last_choice": last["decision"]["choice"],
              "last_distribution": last["decision"]["distribution"],
              "last_constraints": last["constraints"],
              "last_outcome": last["outcome"],
          }, indent=2, sort_keys=True))
          PY

      - name: Render Snake MP4
        run: |
          python -m examples.snake.video \
            --trace /tmp/decisio-snake-smoke.jsonl \
            --output /tmp/decisio-snake.mp4 \
            --frames-dir /tmp/decisio-snake-frames \
            --fps 1 \
            --hold-frames 2
          test -s /tmp/decisio-snake.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            /tmp/decisio-snake.mp4

      - name: Upload Snake video and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisio-snake-qwen35-08b
          path: |
            /tmp/decisio-snake.mp4
            /tmp/decisio-snake-smoke.jsonl
          if-no-files-found: warn
          retention-days: 14
