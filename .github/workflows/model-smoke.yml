name: Real model smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/model-smoke.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/decisio/backends/llama_cpp.py"
      - "src/decisio/compiler.py"
      - "src/decisio/schema.py"
      - "src/decisio/scorers/semantic.py"
      - "benchmarks/fixtures/ci-smoke.json"
      - "examples/snake/**"

permissions:
  contents: read

concurrency:
  group: real-model-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qwen-gguf-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU llama.cpp runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "diskcache>=5.6.1" "jinja2>=2.11.3" "numpy>=1.20" "typing-extensions>=4.5"
          python -m pip install --index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --no-deps "llama-cpp-python==0.3.35"
          python -m pip install -e . --no-deps
      - name: Download pinned Qwen3.5-0.8B Q4_K_M smoke artifact
        run: |
          MODEL=/tmp/Qwen3.5-0.8B-Q4_K_M.gguf
          curl -L --fail --retry 3 \
            "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/91840701981c3152e23662fa4416d7a93cab90e2/Qwen3.5-0.8B-Q4_K_M.gguf?download=true" \
            -o "$MODEL"
          echo "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517  $MODEL" | sha256sum -c -
          echo "DECISIO_SMOKE_MODEL=$MODEL" >> "$GITHUB_ENV"
      - name: Run real Qwen3.5 semantic scorer
        run: |
          decisio score \
            --input benchmarks/fixtures/ci-smoke.json \
            --scorer semantic \
            --model "$DECISIO_SMOKE_MODEL" \
            --device cpu \
            --n-ctx 4096 \
            --threads 2 \
            --threads-batch 2 \
            > /tmp/decisio-real-model-smoke.json
      - name: Verify zero-generation and GGUF provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/decisio-real-model-smoke.json").read_text())
          assert result["generated_tokens"] == 0, result
          assert result["scorer"] == "semantic_comparative_logodds_v2", result
          assert result["probability_status"] == "uncalibrated_conditional_scores", result
          assert result["choice"] in {"billing", "technical"}, result
          assert set(result["distribution"]) == {"billing", "technical"}, result
          assert set(result["binary_conditional_probability"]) == {"billing", "technical"}
          assert abs(sum(result["distribution"].values()) - 1.0) < 1e-6, result
          identity = result["model"]
          assert identity["backend"] == "llama-cpp-python", identity
          assert identity["binding_version"] == "0.3.35", identity
          assert identity["artifact_sha256"] == "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517"
          assert identity["quantization"] == "Q4_K_M", identity
          assert identity["selected_vocab_projection"] is False, identity
          assert identity["shared_context_state"] is True, identity
          assert identity["shared_prefix_primitive"] == "flat_multi_sequence_batch", identity
          PY
      - name: Compare shared-prefix path with fresh reference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from decisio.backends.llama_cpp import LlamaCppBackend, LlamaCppBackendConfig
          from decisio.schema import ChoiceRequest
          from decisio.scorers import SemanticBinaryScorer

          request = ChoiceRequest.from_dict(
              json.loads(Path("benchmarks/fixtures/ci-smoke.json").read_text())
          )
          backend = LlamaCppBackend(
              LlamaCppBackendConfig(
                  model=Path("/tmp/Qwen3.5-0.8B-Q4_K_M.gguf"),
                  n_ctx=4096,
                  n_threads=2,
                  n_threads_batch=2,
              )
          )
          try:
              backend.reset_runtime_metrics()
              shared = SemanticBinaryScorer(backend).score(request)
              shared_metrics = backend.runtime_metrics()
              backend.reset_runtime_metrics()
              fresh = SemanticBinaryScorer(backend.fresh_view()).score(request)
              fresh_metrics = backend.runtime_metrics()

              score_delta = max(
                  abs(shared.scores[key] - fresh.scores[key])
                  for key in shared.scores
              )
              binary_delta = max(
                  abs(
                      shared.binary_conditional_probability[key]
                      - fresh.binary_conditional_probability[key]
                  )
                  for key in shared.binary_conditional_probability
              )
              distribution_delta = max(
                  abs(shared.distribution[key] - fresh.distribution[key])
                  for key in shared.distribution
              )
              evidence = {
                  "same_choice": shared.choice == fresh.choice,
                  "shared_choice": shared.choice,
                  "fresh_choice": fresh.choice,
                  "max_abs_score_delta": score_delta,
                  "max_abs_binary_probability_delta": binary_delta,
                  "max_abs_distribution_delta": distribution_delta,
                  "shared_runtime_metrics": shared_metrics,
                  "fresh_runtime_metrics": fresh_metrics,
              }
              Path("/tmp/decisio-shared-fresh-equivalence.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n"
              )

              assert evidence["same_choice"], evidence
              assert score_delta <= 1e-3, evidence
              assert binary_delta <= 1e-4, evidence
              assert distribution_delta <= 1e-4, evidence
              assert shared_metrics["reused_prefix_tokens"] > 0, evidence
              assert (
                  shared_metrics["physically_evaluated_tokens"]
                  < shared_metrics["logical_input_tokens"]
              ), evidence
              assert fresh_metrics["reused_prefix_tokens"] == 0, evidence
              assert (
                  fresh_metrics["physically_evaluated_tokens"]
                  == fresh_metrics["logical_input_tokens"]
              ), evidence
          finally:
              backend.close()
          PY

      - name: Run real-model Snake rollout
        run: |
          python -m examples.snake.play \
            --model "$DECISIO_SMOKE_MODEL" \
            --threads 2 \
            --threads-batch 2 \
            --n-ctx 4096 \
            --seed 7 \
            --max-steps 5 \
            --trace /tmp/decisio-snake-smoke.jsonl
      - name: Verify Snake decision loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = Path("/tmp/decisio-snake-smoke.jsonl").read_text().splitlines()
          assert 1 <= len(rows) <= 5, rows
          for line in rows:
              record = json.loads(line)
              decision = record["decision"]
              safe = set(record["constraints"]["safe_actions"])
              assert decision["generated_tokens"] == 0, record
              assert abs(sum(decision["distribution"].values()) - 1.0) < 1e-6, record
              if safe:
                  assert decision["choice"] in safe, record
          PY
      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install "pillow==12.3.0"
      - name: Render Snake MP4
        run: |
          python -m examples.snake.video \
            --trace /tmp/decisio-snake-smoke.jsonl \
            --output /tmp/decisio-snake.mp4 \
            --frames-dir /tmp/decisio-snake-frames \
            --fps 1 \
            --hold-frames 2
          test -s /tmp/decisio-snake.mp4
      - name: Upload Snake video and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisio-snake-qwen35-08b-q4km-llamacpp
          path: |
            /tmp/decisio-snake.mp4
            /tmp/decisio-snake-smoke.jsonl
            /tmp/decisio-real-model-smoke.json
            /tmp/decisio-shared-fresh-equivalence.json
          if-no-files-found: warn
          retention-days: 14
