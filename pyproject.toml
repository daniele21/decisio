[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decisio"
version = "0.1.0a0"
description = "Stateful local-LLM decisions with reusable model context and zero-generation typed actions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Decisio contributors"}]
keywords = [
  "llm",
  "llama-cpp",
  "gguf",
  "local-llm",
  "inference",
  "decision-making",
  "qwen",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/daniele21/decisio"
Documentation = "https://github.com/daniele21/decisio/tree/main/docs"
Repository = "https://github.com/daniele21/decisio"
Issues = "https://github.com/daniele21/decisio/issues"

[project.optional-dependencies]
llama = [
  "llama-cpp-python==0.3.35",
]
# Historical scorer-gate-v1 reproduction only; the canonical runtime is the `llama` extra.
qwen = [
  "torch>=2.6",
  "transformers>=5.17,<6",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]
video = [
  "pillow>=10",
]

[project.scripts]
decisio = "decisio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decisio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
