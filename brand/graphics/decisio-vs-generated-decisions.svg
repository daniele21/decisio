<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Decisio vs generated decisions</title>
<desc id="desc">Comparison between autoregressive JSON generation and Decisio typed decision scoring using llama.cpp logits.</desc>
<defs>
  <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#03C27E"/><stop offset="52%" stop-color="#02C9C1"/><stop offset="100%" stop-color="#01C8F6"/></linearGradient>
  <linearGradient id="soft" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#03C27E" stop-opacity=".12"/><stop offset="52%" stop-color="#02C9C1" stop-opacity=".12"/><stop offset="100%" stop-color="#01C8F6" stop-opacity=".12"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#112543" flood-opacity=".08"/></filter>
  <marker id="an" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8292A6"/></marker>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#02C9C1"/></marker>
  <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</defs>
<rect width="1600" height="900" fill="#F7FAFC"/>
<circle cx="1450" cy="110" r="260" fill="#01C8F6" opacity=".035"/><circle cx="1280" cy="820" r="320" fill="#03C27E" opacity=".035"/>
<text x="80" y="82" class="s" font-size="22" font-weight="750" fill="#112543" letter-spacing="1.8">DECISIO</text>
<text x="80" y="128" class="s" font-size="40" font-weight="750" fill="#112543">Generated decisions vs direct decision scoring</text>
<text x="80" y="166" class="s" font-size="20" fill="#66788D">Same bounded application problem. Different inference primitive.</text>
<rect x="70" y="220" width="700" height="590" rx="28" fill="#fff" stroke="#E4EBF2" stroke-width="2" filter="url(#shadow)"/>
<rect x="830" y="220" width="700" height="590" rx="28" fill="#fff" stroke="#BFEFEA" stroke-width="2" filter="url(#shadow)"/>

<rect x="110" y="258" width="168" height="34" rx="17" fill="#EDF2F7"/>
<text x="194" y="281" text-anchor="middle" class="s" font-size="14" font-weight="750" fill="#65768A" letter-spacing=".8">GENERATE + REPAIR</text>
<text x="110" y="338" class="s" font-size="29" font-weight="750" fill="#112543">Generated decision</text>
<text x="110" y="371" class="s" font-size="17" fill="#728399">The model writes an answer, then software turns it back into a decision.</text>

<rect x="110" y="420" width="136" height="82" rx="18" fill="#F8FAFC" stroke="#DCE5ED" stroke-width="2"/>
<text x="178" y="453" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#33475B">prompt</text><text x="178" y="478" text-anchor="middle" class="s" font-size="13" fill="#8292A6">instruction</text>
<line x1="250" y1="461" x2="292" y2="461" stroke="#8292A6" stroke-width="3" marker-end="url(#an)"/>
<rect x="300" y="420" width="154" height="82" rx="18" fill="#F8FAFC" stroke="#DCE5ED" stroke-width="2"/>
<text x="377" y="451" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#33475B">autoregressive</text><text x="377" y="476" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#33475B">JSON</text>
<line x1="458" y1="461" x2="500" y2="461" stroke="#8292A6" stroke-width="3" marker-end="url(#an)"/>
<rect x="508" y="420" width="140" height="82" rx="18" fill="#F8FAFC" stroke="#DCE5ED" stroke-width="2"/>
<text x="578" y="452" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#33475B">parse / repair</text><text x="578" y="477" text-anchor="middle" class="s" font-size="13" fill="#8292A6">validate text</text>
<line x1="652" y1="461" x2="682" y2="461" stroke="#8292A6" stroke-width="3" marker-end="url(#an)"/>
<rect x="690" y="420" width="54" height="82" rx="18" fill="#112543"/>
<text x="717" y="456" text-anchor="middle" class="s" font-size="18" font-weight="800" fill="#fff">APP</text><text x="717" y="478" text-anchor="middle" class="s" font-size="11" fill="#D2F2F1">decision</text>

<line x1="110" y1="560" x2="730" y2="560" stroke="#E5EBF1"/>
<circle cx="126" cy="608" r="5" fill="#8292A6"/><text x="145" y="614" class="s" font-size="17" fill="#526579">Decision is encoded inside generated text.</text>
<circle cx="126" cy="656" r="5" fill="#8292A6"/><text x="145" y="662" class="s" font-size="17" fill="#526579">Application must parse and validate the output.</text>
<circle cx="126" cy="704" r="5" fill="#8292A6"/><text x="145" y="710" class="s" font-size="17" fill="#526579">Candidate set can be implicit in the prompt / schema.</text>

<rect x="870" y="258" width="118" height="34" rx="17" fill="url(#soft)" stroke="#ACEBE4"/>
<text x="929" y="281" text-anchor="middle" class="s" font-size="14" font-weight="800" fill="#087E78" letter-spacing=".9">DECISIO</text>
<text x="870" y="338" class="s" font-size="29" font-weight="750" fill="#112543">Direct decision scoring</text>
<text x="870" y="371" class="s" font-size="17" fill="#587084">Score the supplied choices directly from model logits.</text>

<rect x="870" y="420" width="178" height="82" rx="18" fill="#F9FEFD" stroke="#BDEDE8" stroke-width="2"/>
<text x="959" y="450" text-anchor="middle" class="s" font-size="15" font-weight="750" fill="#112543">state + question</text><text x="959" y="475" text-anchor="middle" class="s" font-size="15" font-weight="750" fill="#112543">+ candidates</text>
<line x1="1052" y1="461" x2="1094" y2="461" stroke="#02C9C1" stroke-width="3" marker-end="url(#ab)"/>
<rect x="1102" y="420" width="148" height="82" rx="18" fill="#F9FEFD" stroke="#BDEDE8" stroke-width="2"/>
<text x="1176" y="451" text-anchor="middle" class="s" font-size="15" font-weight="750" fill="#112543">llama.cpp</text><text x="1176" y="476" text-anchor="middle" class="m" font-size="16" font-weight="750" fill="#112543">logits</text>
<line x1="1254" y1="461" x2="1296" y2="461" stroke="#02C9C1" stroke-width="3" marker-end="url(#ab)"/>
<rect x="1304" y="420" width="122" height="82" rx="18" fill="url(#soft)" stroke="#79E2D7" stroke-width="2"/>
<text x="1365" y="451" text-anchor="middle" class="s" font-size="15" font-weight="800" fill="#112543">Decisio</text><text x="1365" y="476" text-anchor="middle" class="s" font-size="13" fill="#087E78">scoring</text>
<line x1="1430" y1="461" x2="1462" y2="461" stroke="#02C9C1" stroke-width="3" marker-end="url(#ab)"/>
<rect x="1470" y="420" width="34" height="82" rx="17" fill="#112543"/>
<path d="M1481 459l7 7 12-16" fill="none" stroke="#65DFD5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1487" y="487" text-anchor="middle" class="s" font-size="10" fill="#fff">typed</text>

<line x1="870" y1="550" x2="1490" y2="550" stroke="#D2F2F1"/>
<rect x="870" y="586" width="270" height="50" rx="25" fill="#112543"/><circle cx="896" cy="611" r="8" fill="url(#brand)"/><text x="917" y="617" class="s" font-size="15" font-weight="750" fill="#fff">zero answer generation</text>
<rect x="1155" y="586" width="315" height="50" rx="25" fill="#EFFCF9" stroke="#B8ECE5"/><circle cx="1181" cy="611" r="8" fill="#03C27E"/><text x="1202" y="617" class="s" font-size="15" font-weight="750" fill="#112543">runtime-defined candidates</text>
<rect x="870" y="650" width="368" height="50" rx="25" fill="#EFFCF9" stroke="#B8ECE5"/><circle cx="896" cy="675" r="8" fill="#01C8F6"/><text x="917" y="681" class="s" font-size="15" font-weight="750" fill="#112543">bring your own compatible GGUF</text>
<text x="870" y="754" class="s" font-size="14" fill="#6A7D90">No performance claim implied — benchmark evidence is reported separately.</text>

