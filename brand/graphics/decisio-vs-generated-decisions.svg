<line x1="80" y1="844" x2="1520" y2="844" stroke="#E2EAF1"/>
<text x="80" y="874" class="s" font-size="13" fill="#8A9BAD">Decisio • training-free, zero-generation decision scoring for compatible open-weight causal LLMs</text>
</svg>